#version: "3.9"

services:
  db:
    image: postgres:17
    container_name: soderia_db
    restart: always
    env_file:
      - .env
    environment:
      # Mismas credenciales que usa la app para conectarse (TENANT_DB_*):
      # todas las bases (control plane + soderías) viven en esta instancia.
      # POSTGRES_DB solo importa para el arranque del contenedor: las bases
      # reales las crea la app (CREATE DATABASE) contra TENANT_DB_MAINTENANCE_DB.
      POSTGRES_DB: ${TENANT_DB_MAINTENANCE_DB:-postgres}
      POSTGRES_USER: ${TENANT_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TENANT_DB_PASSWORD:?falta TENANT_DB_PASSWORD en .env}
      TZ: America/Argentina/Buenos_Aires
      PGTZ: America/Argentina/Buenos_Aires
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Usamos $$ para que el shell dentro del contenedor expanda las vars en runtime
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servicio de backend para desarrollo
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soderia_backend
    env_file:
      - .env
    ports:
      #- "8500:8000" 
      - "127.0.0.1:8719:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app   # montaje en caliente
      - data:/data   # comprobantes/documentos, igual que en prod
    profiles: ["dev"]

  # Servicio de backend para producción
  backend-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: soderia_backend_prod
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # STORAGE_LOCAL_PATH=/data: comprobantes y documentos de todas las
      # soderías. Sin este volumen se pierden en cada recreate/deploy del
      # contenedor. Entra en la política de backup igual que pgdata.
      - data:/data
    profiles: ["prod"]

volumes:
  pgdata:
  data:
